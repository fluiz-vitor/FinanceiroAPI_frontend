<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="assets/icon/favicon.jpeg">
  <title>GDN - Financeiro</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

  <div class="stage">
    <div class="corner tl"></div>
    <div class="corner br"></div>

    <!-- decorative chart line: bottom-left to top-right, fully responsive -->
    <svg class="chart-bg" viewBox="0 0 1000 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="barGrad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#3aa8ff" stop-opacity="0.05" />
          <stop offset="100%" stop-color="#2fd9b8" stop-opacity="0.45" />
        </linearGradient>
      </defs>
      <g fill="url(#barGrad)">
        <rect class="bar" x="10" y="555" width="55" height="45" />
        <rect class="bar" x="100" y="500" width="55" height="100" />
        <rect class="bar" x="190" y="450" width="55" height="150" />
        <rect class="bar" x="280" y="390" width="55" height="210" />
        <rect class="bar" x="370" y="330" width="55" height="270" />
        <rect class="bar" x="460" y="275" width="55" height="325" />
        <rect class="bar" x="550" y="215" width="55" height="385" />
        <rect class="bar" x="640" y="160" width="55" height="440" />
        <rect class="bar" x="730" y="100" width="55" height="500" />
        <rect class="bar" x="820" y="45" width="55" height="555" />
        <rect class="bar" x="910" y="5" width="55" height="595" />
      </g>
      <polyline class="chart-line"
        points="0,600 37,577 127,550 217,525 307,495 397,465 487,437 577,407 667,380 757,350 847,322 937,302 1000,0"
        fill="none" stroke="#2fd9b8" stroke-width="4" opacity="0.85" vector-effect="non-scaling-stroke" />
      <circle class="dot-ring" cx="1000" cy="0" r="9" fill="none" stroke="#2fd9b8" stroke-width="3" />
      <circle class="dot-core" cx="1000" cy="0" r="7" fill="#2fd9b8" />
    </svg>

    <div class="left">
      <div class="eyebrow">SISTEMA</div>
      <h1 class="title">
        <span class="gdn-word">GDN</span> <span class="dash">–</span>
        <span class="fin-word">FINANCEIRO</span>
      </h1>
      <p class="tagline">Controle. Organização. Resultado.</p>
      <div class="rule"></div>
      <p class="desc">Gerencie as finanças na GDN de forma simples, segura e eficiente.</p>
    </div>

    <div class="card">
      <div class="card-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
          <path d="M3 17L9 11L13 15L21 6" stroke="#3aa8ff" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M15 6H21V12" stroke="#3aa8ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h2>Bem-vindo</h2>
      <p class="sub">Entre para acessar o sistema.</p>

      <form id="formLogin">
        <label for="nomeUsuario">Usuário ou e-mail</label>
        <div class="field">
          <input type="text" id="nomeUsuario" name="nomeUsuario" placeholder="Digite seu usuário ou e-mail" required>
        </div>

        <label for="senha">Senha</label>
        <div class="field">
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
          <span class="eye" onclick="alternarVisibilidadeSenha()">&#128065;</span>
        </div>

        <p id="mensagemErro" class="mensagem-erro"></p>

        <button class="btn" type="button" onclick="fazerLogin()">&#8674; ENTRAR</button>
      </form>

      <div class="divider">
        <div class="line"></div>
      </div>

      <div class="forgot">Esqueci minha senha</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
